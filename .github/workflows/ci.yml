name: C++17 package
on: [push, pull_request, workflow_dispatch]

jobs:
  standalone-core:
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        os: [ubuntu-latest, windows-2022]
        include:
          - os: ubuntu-latest
            generator: Unix Makefiles
          - os: windows-2022
            generator: Visual Studio 17 2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure bundled standalone core
        run: cmake -S . -B tmp/agent-work/ci -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DRATEWEAVER_DEPENDENCY_MODE=BUNDLED -DRATEWEAVER_BUILD_EXAMPLES=ON
      - name: Build public headers and tests
        run: cmake --build tmp/agent-work/ci --config ${{ matrix.configuration }} --parallel 2
      - name: Test core and independent consumers
        run: ctest --test-dir tmp/agent-work/ci -C ${{ matrix.configuration }} --output-on-failure

  native:
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        os: [ubuntu-latest, windows-2022]
        include:
          - os: ubuntu-latest
            generator: Unix Makefiles
          - os: windows-2022
            generator: Visual Studio 17 2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Linux TLS build prerequisite
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev python3
      - name: Configure pinned dependencies and native HTTP
        run: cmake -S . -B tmp/agent-work/ci -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DRATEWEAVER_DEPENDENCY_MODE=BUNDLED -DRATEWEAVER_CURL_MODE=BUNDLED -DRATEWEAVER_BUILD_EXAMPLES=ON -DRATEWEAVER_BUILD_PROVIDERS=ON -DRATEWEAVER_ENABLE_ECB=ON -DRATEWEAVER_ENABLE_KURLYK=ON
      - name: Build public headers, tests and examples
        run: cmake --build tmp/agent-work/ci --config ${{ matrix.configuration }} --parallel 2
      - name: Test native HTTP and independent consumers
        run: ctest --test-dir tmp/agent-work/ci -C ${{ matrix.configuration }} --output-on-failure

  mingw:
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-make mingw-w64-x86_64-python
      - name: Configure pinned dependencies and native HTTP
        run: cmake -S . -B tmp/agent-work/ci -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DRATEWEAVER_DEPENDENCY_MODE=BUNDLED -DRATEWEAVER_CURL_MODE=BUNDLED -DRATEWEAVER_BUILD_EXAMPLES=ON -DRATEWEAVER_BUILD_PROVIDERS=ON -DRATEWEAVER_ENABLE_ECB=ON -DRATEWEAVER_ENABLE_KURLYK=ON
      - name: Build public headers, tests and examples
        run: cmake --build tmp/agent-work/ci --config ${{ matrix.configuration }} --parallel 2
      - name: Test native HTTP and independent consumers
        run: ctest --test-dir tmp/agent-work/ci -C ${{ matrix.configuration }} --output-on-failure
